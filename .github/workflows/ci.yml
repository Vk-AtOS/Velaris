# Velaris CI (KAN-112). No repository secrets are needed: GITHUB_TOKEN is the automatic, read-only token.
name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: "requirements.txt\nrequirements-dev.txt\ndeploy/constraints.txt"}
      - run: pip install -r requirements-dev.txt -c deploy/constraints.txt
      - run: python -m pytest -q
      - name: Smoke (starts the API with dummy credentials)
        run: python deploy/smoke.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ruff==0.15.4
      # F (pyflakes: unused imports/variables, undefined names), E9 (syntax) and B904 (raise ... from) are clean (KAN-59) and block.
      - run: ruff check --select F,E9,B904 .
      # the tests import pytest and pyyaml, which live in requirements-dev.txt: the import-resolution check must see them
      - run: pip install -r requirements-dev.txt -c deploy/constraints.txt && python tools/check_structure.py   # KAN-174: size, broad excepts, unresolved imports, cycles

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      # --disable-pip is only valid with --no-deps; constraints.txt is the full pinned closure, so nothing is missed.
      - run: pip install pip-audit
      - run: pip-audit -r deploy/constraints.txt --no-deps --disable-pip --strict

  secrets:
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR commits on pull_request events; contents: read alone gives HTTP 403 before any scan.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      # gitleaks-action needs a licence key only for organisation-owned repositories (GITLEAKS_LICENSE secret, set by the owner).
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
