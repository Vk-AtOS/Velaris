# Goes in the http {} context (conf.d/velaris-public-http.conf). Pairs with velaris-public.conf.
# KAN-128. Tokens are in URL paths (e-mailed links): they must never reach a log, so the log format uses the masked path
# below and never $request, $request_uri, $args, $http_referer or any cookie/authorization variable.

map $uri $velaris_masked_uri {
    ~^(?<pre>/(?:careers/status|careers/withdraw|schedule|interview|sign)/)[^/]+(?<post>.*)$  "${pre}***${post}";
    default $uri;
}

log_format velaris_public '$remote_addr [$time_iso8601] "$request_method $velaris_masked_uri" $status $body_bytes_sent '
                          '$request_time rid=$request_id';

# one bucket per client address; the app has its own per-token and per-IP limits behind this coarse one
limit_req_zone  $binary_remote_addr zone=velaris_public_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=velaris_public_conn:10m;

# Behind a load balancer or the AetherOS proxy, trust ONLY its address so $remote_addr is the real client:
#   set_real_ip_from 10.0.0.0/8;   real_ip_header X-Forwarded-For;   real_ip_recursive on;
