# Velaris CI (KAN-112). No repository secrets are needed: GITHUB_TOKEN is the automatic, read-only token.
name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip, cache-dependency-path: "requirements.txt\ndeploy/constraints.txt"}
      - run: pip install -r requirements.txt -c deploy/constraints.txt
      - run: pip install pyyaml   # deploy manifests are parsed by velaris/tests/test_deploy_packaging.py
      - run: python -m pytest -q
      - name: Smoke (starts the API with dummy credentials)
        run: python deploy/smoke.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ruff==0.15.4
      # The blocking set is real errors only (syntax, undefined names, bad comparisons). The repository's style findings are
      # reported but do not fail the build until they are cleaned up: then drop --select.
      - run: ruff check --select E9,F63,F7,F82 .

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pip-audit
      - run: pip-audit -r deploy/constraints.txt --strict --disable-pip

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      # gitleaks-action needs a licence key only for organisation-owned repositories (GITLEAKS_LICENSE secret, set by the owner).
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
