# Shared by every allowed location (copy to /etc/nginx/snippets/). Header scrubbing + forwarding.
proxy_pass http://velaris_public;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;

# X-Forwarded-For is REPLACED, not appended: the app (VELARIS_PUBLIC_TRUST_PROXY=1) takes the last entry, which must be the
# address nginx saw, so a client-supplied X-Forwarded-For can never choose its own rate-limit bucket.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP "";
proxy_set_header X-Forwarded-Host "";
proxy_set_header X-Forwarded-Proto $scheme;

# This surface has no cookies and no identity: drop anything that could carry one, and anything the gateway signs with.
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_set_header X-Velaris-Signature "";
proxy_set_header X-Velaris-Identity "";
proxy_set_header X-Velaris-Nonce "";
proxy_set_header X-Velaris-Timestamp "";
proxy_hide_header Set-Cookie;
proxy_hide_header Server;
proxy_hide_header X-Powered-By;

# Audio upload (up to 200 MB, streamed): no request buffering on disk by nginx, long send/read timeouts. Same scrubbing as the common snippet.
proxy_connect_timeout 3s;
proxy_send_timeout 900s;
proxy_read_timeout 900s;
proxy_request_buffering off;
