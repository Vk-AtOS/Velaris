# Example: Velaris API + public app as separate services. Copy, then adjust. No secrets in this file: they come from ./secrets/
# and the environment of the host (docker compose reads .env next to this file; keep that file out of git).
#
#   mkdir -p secrets && openssl rand -hex 32 > secrets/velaris_api_secret && chmod 600 secrets/*
#   cp <aetheros identity public key PEM> secrets/identity_public.pem
#   python3.11 -c "from velaris.core import vault; print(vault.new_key())" > secrets/vault.key && chmod 600 secrets/vault.key   # encryption key
#   VELARIS_ORG=acme docker compose -f deploy/docker-compose.example.yml up -d
#
# The API (8730) is reachable only from other services on the internal network below (the AetherOS gateway joins it).
# It is never published. The public app (8731) is published on the host's loopback only, for nginx (deploy/nginx).
name: velaris

x-velaris: &velaris
  image: velaris:local                   # docker build -f deploy/Dockerfile -t velaris:local .
  restart: unless-stopped
  read_only: true                        # root filesystem is read-only; /data (volume) and /tmp (tmpfs) are the writable paths
  tmpfs: ["/tmp:size=64m,mode=1777"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  environment: &env
    VELARIS_ORG: ${VELARIS_ORG:?set VELARIS_ORG (one organisation per deployment)}
    VELARIS_DATA: /data
    VELARIS_VAULT_KEY_FILE: /run/vault/vault.key     # outside the data volume; mode 0600
  volumes:
    - velaris_data:/data
    - ./secrets/vault.key:/run/vault/vault.key:ro
  logging: {driver: json-file, options: {max-size: "20m", max-file: "5"}}

services:
  api:
    <<: *velaris
    command: ["python", "-m", "velaris.api"]
    environment:
      <<: *env
      VELARIS_API_HOST: 0.0.0.0          # inside the container; the port is not published
      VELARIS_API_SECRET: ${VELARIS_API_SECRET:?set VELARIS_API_SECRET (>= 32 bytes) in the host environment}
      VELARIS_IDENTITY_PUBLIC_KEY: /run/identity/identity_public.pem
      VELARIS_METRICS_PORT: "9730"       # internal listener for Prometheus; not published
      VELARIS_METRICS_HOST: 0.0.0.0
    volumes:
      - velaris_data:/data
      - ./secrets/vault.key:/run/vault/vault.key:ro
      - ./secrets/identity_public.pem:/run/identity/identity_public.pem:ro
    expose: ["8730", "9730"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py", "8730", "/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  public:
    <<: *velaris
    command: ["python", "-m", "velaris.api.public"]
    environment:
      <<: *env
      VELARIS_PUBLIC_HOST: 0.0.0.0
      VELARIS_PUBLIC_TRUST_PROXY: "1"    # exactly one trusted proxy (nginx) in front
      VELARIS_PUBLIC_CORS_ORIGINS: ${VELARIS_PUBLIC_CORS_ORIGINS:-}
    ports:
      - "127.0.0.1:8731:8731"            # loopback only; nginx terminates TLS
    networks: [internal, edge]
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py", "8731"]     # TCP: the public app has no /health route
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  velaris_data: {}

networks:
  internal: {internal: true}            # no route out or in except between its members; add the AetherOS gateway here
  edge: {}
