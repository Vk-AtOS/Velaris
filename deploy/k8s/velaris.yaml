# Kubernetes manifests for one Velaris deployment (one organisation). KAN-112.  kubectl apply -n velaris -f deploy/k8s/velaris.yaml
# No secret values here: create the Secret from secret.example.yaml's shape (kubectl create secret ... or your secret manager).
# Replace: image, namespace label of the AetherOS gateway, StorageClass.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: velaris-data, labels: {app.kubernetes.io/name: velaris}}
spec:
  accessModes: [ReadWriteOnce]            # API and public app share the volume: they are scheduled on the same node (pod affinity below)
  resources: {requests: {storage: 20Gi}}
  # storageClassName: CHANGE_ME
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: velaris-api, labels: {app.kubernetes.io/name: velaris, app.kubernetes.io/component: api}}
spec:
  replicas: 1                             # ponytail: the replay cache is per process (velaris/api/auth.py); do not raise without a shared nonce store
  strategy: {type: Recreate}              # one writer on the volume during a rollout
  selector: {matchLabels: {app.kubernetes.io/name: velaris, app.kubernetes.io/component: api}}
  template:
    metadata: {labels: {app.kubernetes.io/name: velaris, app.kubernetes.io/component: api}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: CHANGE_ME_REGISTRY/velaris:CHANGE_ME_TAG
          command: ["python", "-m", "velaris.api"]
          ports: [{name: http, containerPort: 8730}, {name: metrics, containerPort: 9730}]
          env:
            - {name: VELARIS_DATA, value: /data}
            - {name: VELARIS_API_HOST, value: 0.0.0.0}
            - {name: VELARIS_IDENTITY_PUBLIC_KEY, value: /run/velaris/identity_public.pem}
            - {name: VELARIS_METRICS_PORT, value: "9730"}
            - {name: VELARIS_METRICS_HOST, value: 0.0.0.0}
            - name: VELARIS_ORG
              valueFrom: {secretKeyRef: {name: velaris-secrets, key: org}}
            - name: VELARIS_API_SECRET
              valueFrom: {secretKeyRef: {name: velaris-secrets, key: api_secret}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: identity, mountPath: /run/velaris, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 30, failureThreshold: 3}
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {memory: 2Gi}}
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: velaris-data}}
        - {name: identity, secret: {secretName: velaris-identity-public, defaultMode: 0444}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: velaris-api, labels: {app.kubernetes.io/name: velaris}}
spec:
  type: ClusterIP                         # never LoadBalancer/NodePort: only the AetherOS gateway may call this
  selector: {app.kubernetes.io/name: velaris, app.kubernetes.io/component: api}
  ports: [{name: http, port: 8730, targetPort: http}]     # metrics (9730) is deliberately not in the Service
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: velaris-public, labels: {app.kubernetes.io/name: velaris, app.kubernetes.io/component: public}}
spec:
  replicas: 1                             # ponytail: per-process rate counters; one replica until they move to a shared store
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: velaris, app.kubernetes.io/component: public}}
  template:
    metadata: {labels: {app.kubernetes.io/name: velaris, app.kubernetes.io/component: public}}
    spec:
      automountServiceAccountToken: false
      affinity:
        podAffinity:                      # same node as the API: they share the ReadWriteOnce data volume
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {app.kubernetes.io/name: velaris, app.kubernetes.io/component: api}}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: public
          image: CHANGE_ME_REGISTRY/velaris:CHANGE_ME_TAG
          command: ["python", "-m", "velaris.api.public"]
          ports: [{name: http, containerPort: 8731}]
          env:
            - {name: VELARIS_DATA, value: /data}
            - {name: VELARIS_PUBLIC_HOST, value: 0.0.0.0}
            - {name: VELARIS_PUBLIC_TRUST_PROXY, value: "1"}
            - name: VELARIS_ORG
              valueFrom: {secretKeyRef: {name: velaris-secrets, key: org}}
            - name: VELARIS_PUBLIC_CORS_ORIGINS
              valueFrom: {secretKeyRef: {name: velaris-secrets, key: public_cors_origins, optional: true}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
          readinessProbe: {tcpSocket: {port: http}, periodSeconds: 10}
          livenessProbe: {tcpSocket: {port: http}, periodSeconds: 30}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {memory: 1Gi}}
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
      volumes:
        - {name: data, persistentVolumeClaim: {claimName: velaris-data}}
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: velaris-public, labels: {app.kubernetes.io/name: velaris}}
spec:
  type: ClusterIP                         # exposed only through your ingress with deploy/nginx's path allowlist
  selector: {app.kubernetes.io/name: velaris, app.kubernetes.io/component: public}
  ports: [{name: http, port: 8731, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: velaris-api-allow-gateway-only}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: velaris, app.kubernetes.io/component: api}}
  policyTypes: [Ingress]
  ingress:
    - from:                               # only the AetherOS gateway pods
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: CHANGE_ME_AETHEROS_NAMESPACE}}
          podSelector: {matchLabels: {app.kubernetes.io/name: aetheros, app.kubernetes.io/component: gateway}}
      ports: [{port: 8730, protocol: TCP}]
    - from:                               # Prometheus scrapes the internal metrics listener
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: CHANGE_ME_MONITORING_NAMESPACE}}
      ports: [{port: 9730, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: velaris-public-allow-ingress-only}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: velaris, app.kubernetes.io/component: public}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: CHANGE_ME_INGRESS_NAMESPACE}}
      ports: [{port: 8731, protocol: TCP}]
