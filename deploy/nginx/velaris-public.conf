# Public Velaris app (python -m velaris.api.public on 127.0.0.1:8731) behind nginx. KAN-128. See deploy/README.md.
# Edit: server_name, certificate paths. Needs velaris-public-http.conf in http {}.
# App environment: VELARIS_PUBLIC_TRUST_PROXY=1 (exactly one trusted proxy: this one),
#                  VELARIS_PUBLIC_CORS_ORIGINS=https://careers.example.com,https://sign.example.com (exact origins, never *).

upstream velaris_public { server 127.0.0.1:8731; keepalive 16; }

server {
    listen 80;
    server_name careers.example.com sign.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name careers.example.com sign.example.com;

    ssl_certificate     /etc/letsencrypt/live/careers.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/careers.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log /var/log/nginx/velaris-public.access.log velaris_public;
    error_log  /var/log/nginx/velaris-public.error.log warn;

    # default body cap: the largest small route (4 KiB) with headroom; apply and events override below
    client_max_body_size 8k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    large_client_header_buffers 4 8k;
    limit_req  zone=velaris_public_ip burst=40 nodelay;
    limit_req_status 429;
    limit_conn velaris_public_conn 20;

    # Nothing is proxied unless a location below matches exactly. Everything else (docs, /agents, /metrics, /health ...) is 404 here.
    location / { return 404; }

    # HTML pages (KAN-123..127): the app serves shells and three static files; behaviour is in /static/public.js. The app sets the CSP.
    location ~ ^/apply/[A-Za-z0-9_-]{1,80}$                      { limit_except GET { deny all; } include snippets/velaris-public-proxy.conf; }
    location ~ ^/(?:status|withdraw|schedule|sign|interview)/[A-Za-z0-9_-]{20,100}$ { limit_except GET { deny all; } include snippets/velaris-public-proxy.conf; }
    location ~ ^/static/(?:public\.js|pow-worker\.js|public\.css)$ { limit_except GET { deny all; } include snippets/velaris-public-proxy.conf; }
    location ~ ^/jobs/[a-z0-9-]{1,80}(?:/apply)?$                 { limit_except GET { deny all; } include snippets/velaris-public-proxy.conf; }

    # Careers (form text, proof-of-work challenge, application, status, withdraw)
    location ~ ^/careers/(?:forms|challenge)/[A-Za-z0-9_-]{1,80}$ { limit_except GET { deny all; } include snippets/velaris-public-proxy.conf; }
    location ~ ^/careers/apply/[A-Za-z0-9_-]{1,80}$              { limit_except POST { deny all; } client_max_body_size 2m; include snippets/velaris-public-proxy.conf; }
    location ~ ^/careers/status/[A-Za-z0-9_-]{20,100}$           { limit_except GET { deny all; } include snippets/velaris-public-proxy.conf; }
    location ~ ^/careers/withdraw/[A-Za-z0-9_-]{20,100}$         { limit_except POST { deny all; } include snippets/velaris-public-proxy.conf; }

    # Interview self-scheduling
    location ~ ^/schedule/[A-Za-z0-9_-]{20,100}/slots$           { limit_except GET { deny all; } include snippets/velaris-public-proxy.conf; }
    location ~ ^/schedule/[A-Za-z0-9_-]{20,100}/(?:pick|cancel)$ { limit_except POST { deny all; } include snippets/velaris-public-proxy.conf; }

    # Interview participants (audio is not served here)
    location ~ ^/interview/[A-Za-z0-9_-]{20,100}/events$         { limit_except POST { deny all; } client_max_body_size 64k; include snippets/velaris-public-proxy.conf; }
    location ~ ^/interview/[A-Za-z0-9_-]{20,100}/audio$          { limit_except POST { deny all; } client_max_body_size 200m; include snippets/velaris-public-proxy-upload.conf; }
    location ~ ^/interview/[A-Za-z0-9_-]{20,100}/(?:consent|withdraw)$ { limit_except POST { deny all; } include snippets/velaris-public-proxy.conf; }

    # E-sign ceremony
    location ~ ^/sign/[A-Za-z0-9_-]{20,100}/(?:open|otp/request|otp/verify|consent|sign|decline)$ { limit_except POST { deny all; } include snippets/velaris-public-proxy.conf; }
}
